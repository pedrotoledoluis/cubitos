<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Historia en Cubitos 002 - thumbnail</title>
    <style>
      @font-face {
        font-family: "HC Display";
        src: url("../assets/fonts/ariblk.ttf") format("truetype");
        font-weight: 900;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0d1226;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #bigtext {
        position: absolute;
        top: 3%;
        left: 52%;
        right: 2%;
        margin: 0;
        text-align: center;
        color: #ffe14a;
        font-family: "HC Display", sans-serif;
        font-weight: 900;
        font-size: 80px;
        line-height: 1.08;
        -webkit-text-stroke: 16px #000000;
        paint-order: stroke fill;
        text-shadow: 0 9px 0 rgba(0, 0, 0, 0.7);
        rotate: -3deg;
      }
    </style>
    <script src="../vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "../vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="thumbnail" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <canvas id="stage" width="1280" height="720"></canvas>
      <div id="bigtext">¡LO ATACARON CONEJOS!</div>
    </div>
    <script>
      // Root timeline (empty): the Three.js stage renders from hf-seek; root data-duration sets the length.
      window.__timelines["thumbnail"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import { createStage } from "../src/stage.js";

      const stage = createStage({ canvas: document.getElementById("stage"), width: 1280, height: 720, mode: "thumbnail" });
      window.addEventListener("hf-seek", () => stage.renderAt(1.3));
      document.fonts.load('900 92px "HC Display"').then(() => stage.renderAt(1.3));
    </script>
  </body>
</html>
