<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cubitos Thumbnail</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* 1280x720. Text lives in the left 60%; the character reacts on the right. */
  #burst { position: absolute; right: -140px; top: -200px; width: 900px; height: 1100px;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,210,58,.30) 0 10deg, rgba(255,210,58,0) 10deg 20deg);
    -webkit-mask: radial-gradient(circle at 50% 50%, #000 0 40%, transparent 70%); mask: radial-gradient(circle at 50% 50%, #000 0 40%, transparent 70%); }
  #text { position: absolute; left: 36px; top: 40px; width: 730px; height: 560px; display: flex; align-items: center;
    font-family: "Arial Black", "Segoe UI Black", sans-serif; font-weight: 900; line-height: 1.02; color: #ffd23a;
    text-transform: uppercase; -webkit-text-stroke: 0.17em #0a0a14; paint-order: stroke fill;
    text-shadow: 0 0.08em 0 #0a0a14, 0 0.14em 0 rgba(0,0,0,.55); transform: rotate(-2.5deg); }
  #text .hl { color: #fff; }
  #badge { position: absolute; left: 36px; bottom: 30px; font-size: 30px; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="bg" class="layer"></canvas>
<div id="burst"></div>
<div id="three" class="layer"></div>
<div id="text"></div>
<div id="badge"></div>
<script type="module">
// Query params:
//   text     headline (max ~6 words). Wrap a word in *stars* to make it white.
//   who      tito (default) | profe
//   emotion  tito: surprised|scared|happy|skeptical|neutral   pose (profe): facepalm|shrug|explain|idle
import { paintSkyline, create3DLayer, logoHTML, fitText } from './brand.js';
const q = new URLSearchParams(location.search);
const W = 1280, H = 720;
const bg = document.getElementById('bg'); bg.width = W; bg.height = H;
paintSkyline(bg, { seed: 11, glow: [1010, 380, 520], horizon: 0.55, roof: 640, density: 0.6 });
// darken left side so the text pops
const g = bg.getContext('2d');
const sh = g.createLinearGradient(0, 0, W * 0.7, 0);
sh.addColorStop(0, 'rgba(5,8,22,.75)'); sh.addColorStop(1, 'rgba(5,8,22,0)');
g.fillStyle = sh; g.fillRect(0, 0, W, H);

const who = q.get('who') || 'tito';
const cast = who === 'profe'
  ? [{ who: 'profe', px: [1030, 700], yaw: -0.25, state: { pose: q.get('pose') || 'facepalm', lookAt: [-4, 1, 4] } }]
  : [{ who: 'tito', px: [1020, 705], yaw: -0.3, state: { emotion: q.get('emotion') || 'surprised', lookAt: [-5, 1.6, 4] } }];
const layer = create3DLayer(document.getElementById('three'), { width: W, height: H, ppu: who === 'profe' ? 300 : 420, tilt: 0.1, cast });
layer.render(1.3);

const raw = q.get('text') || '¡ESTO *PASÓ* DE VERDAD!';
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const el = document.getElementById('text');
el.innerHTML = `<span>${esc(raw).replace(/\*(.+?)\*/g, '<span class="hl">$1</span>')}</span>`;
await document.fonts.ready;
fitText(el, 150, 60);
document.getElementById('badge').innerHTML = logoHTML();
document.querySelector('#badge .logo').style.fontSize = '30px';
window.sheetReady = true;
</script>
</body>
</html>
