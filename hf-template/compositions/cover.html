<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Historia en Cubitos - Shorts cover</title>
    <style>
      /* Shorts cover (9:16). YouTube ignores custom thumbnails on Shorts for non-partner channels, so this frame is
         prepended to the video and picked as the cover in the YouTube app. Headline in the top ~40%, cast below;
         keep the bottom ~22% and the right edge free (Shorts UI: title, channel, buttons). */
      @font-face {
        font-family: "HC Display";
        src: url("../assets/fonts/ariblk.ttf") format("truetype");
        font-weight: 900;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1230;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Dark top for the headline + vignette on every edge. */
      #shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(6, 8, 22, 0.9) 0%, rgba(6, 8, 22, 0.75) 30%, rgba(6, 8, 22, 0.2) 46%, rgba(6, 8, 22, 0) 54%),
          radial-gradient(ellipse 85% 75% at 50% 60%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.6) 100%);
      }
      #text {
        position: absolute;
        left: 50px;
        top: 150px;
        width: 900px;
        height: 640px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #badge {
        display: none;
        margin: 0 0 26px;
        padding: 8px 30px 10px;
        background: #ffd23a;
        color: #0a0a14;
        font-family: "HC Display", sans-serif;
        font-weight: 900;
        font-size: 62px;
        line-height: 1;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        border: 7px solid #0a0a14;
        border-radius: 16px;
        box-shadow: 8px 10px 0 #0a0a14;
        rotate: -5deg;
      }
      #bigtext {
        margin: 0;
        text-align: center;
        color: #ffd23a;
        font-family: "HC Display", sans-serif;
        font-weight: 900;
        font-size: 128px;
        line-height: 1.04;
        text-transform: uppercase;
        -webkit-text-stroke: 22px #0a0a14;
        paint-order: stroke fill;
        text-shadow: 0 12px 0 #0a0a14, 0 22px 16px rgba(0, 0, 0, 0.55);
        rotate: -3deg;
      }
      /* The starred key word: white on a red tilted box (contrasting with the yellow headline). */
      #bigtext .key {
        display: inline-block;
        margin: 8px 0 12px;
        padding: 0 22px 10px;
        color: #ffffff;
        background: #e0402f;
        border: 8px solid #0a0a14;
        border-radius: 14px;
        box-shadow: 10px 12px 0 #0a0a14;
        text-shadow: none;
        rotate: 2deg;
      }
    </style>
    <script src="../vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "../vendor/three.module.js" } }
    </script>
    <script src="../src/episode-data.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920"></canvas>
      <div id="shade"></div>
      <div id="text">
        <div id="badge"></div>
        <div id="bigtext"></div>
      </div>
    </div>
    <script>
      // Root timeline (empty): the Three.js stage renders from hf-seek; root data-duration sets the length.
      window.__timelines["cover"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import { createStage } from "../src/stage.js";

      const ep = window.EPISODE ?? {};
      // Same headline rules as thumbnail.html: the *starred* word gets the red box, trailing punctuation joins it.
      const big = document.getElementById("bigtext");
      (ep.thumbnailText ?? "").replace(/\*([^*]+)\*([?!.,:;…]+)/g, "*$1$2*").split(/(\*[^*]+\*)/).forEach((part) => {
        if (!part) return;
        const span = document.createElement("span");
        span.textContent = part.replace(/\*/g, "");
        if (part.startsWith("*")) span.className = "key";
        big.appendChild(span);
      });
      const badge = document.getElementById("badge");
      if (ep.thumbnailBadge) { badge.textContent = ep.thumbnailBadge; badge.style.display = "inline-block"; }

      // Shrink the headline until it fits its box (deterministic: depends only on text and font metrics).
      const box = document.getElementById("text");
      function fit() {
        let size = 128;
        big.style.fontSize = `${size}px`;
        while (size > 70 && (box.scrollHeight > box.clientHeight || big.scrollWidth > box.clientWidth)) {
          size -= 4;
          big.style.fontSize = `${size}px`;
          big.style.webkitTextStroke = `${Math.round(size * 0.17)}px #0a0a14`;
        }
      }

      const stage = createStage({ canvas: document.getElementById("stage"), width: 1080, height: 1920, mode: "thumbnail", episode: ep });
      window.addEventListener("hf-seek", () => stage.renderAt(1.3));
      document.fonts.load('900 128px "HC Display"').then(() => { fit(); stage.renderAt(1.3); });
    </script>
  </body>
</html>
